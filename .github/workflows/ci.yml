name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # tests/ parses the source with `ast` rather than importing it, so the
      # GPU stack (torch, torch_geometric, rdkit) is deliberately not installed
      # here. That is what keeps this job fast enough to gate every push.
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run contract tests
        run: python -m pytest tests/ -v
